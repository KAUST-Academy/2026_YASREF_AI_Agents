[[extra]]
name   = "LocalRAG: Ask Your Documents"
detail = "The Day 2 RAG lab as a Windows program: build a vector database from a folder of documents, choose an embedding model and a local language model (Qwen3.5-4B by default), and get answers with citations, with the retrieved passages, the prompt and the timings on screen. Includes a guide to turning a Python lab into an .exe."
kind   = "code"
github = "https://github.com/KAUST-Academy/LocalRAG"
status = "ready"
